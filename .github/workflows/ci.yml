name: Events-API CI-CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: Production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t events-api:latest . --platform linux/amd64

    - name: Run container
      run: |
        docker run -d -p 5000:5000 --name events-api-container events-api:latest
        sleep 5
        curl http://localhost:5000/api/health || exit 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
          python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest -v

    - name: Stop Docker and remove container
      if: always()
      run: |
        docker stop events-api-container
        docker rm events-api-container

    - name: Log into Docker
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Tag Docker container
      run: |
        docker tag events-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest
        docker tag events-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/events-api:${{ github.sha }}

    - name: Push to Docker Hub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/events-api:${{ github.sha }}

    - name: Trigger Render deploy
      run: |
        curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
